name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor and add Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.shuvorajbongshi.neonoverdrive",
            "appName": "Neon Overdrive",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          npx cap copy android

      - name: Fix Kotlin duplicate classes and build release AAB
        run: |
          node -e '
            const fs = require("fs");
            const gradlePath = "android/app/build.gradle";
            let content = fs.readFileSync(gradlePath, "utf8");
            const fixBlock = `
configurations.all {
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
    }
}
`;
            fs.writeFileSync(gradlePath, content + "\n" + fixBlock);
          '
          cd android && ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-overdrive-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
